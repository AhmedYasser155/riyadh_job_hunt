<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دليل الأغذية والمكملات – الرياض</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{--bg:#eef2f3;--surface:#fff;--ink:#14272e;--muted:#5b6f77;--line:#d5dee1;--accent:#0b6e78;--accent-ink:#fff;--chip:#dfeaec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b20;--surface:#172830;--ink:#e6f0f2;--muted:#93a9b1;--line:#27404a;--accent:#4cc3cf;--accent-ink:#06242a;--chip:#1f3640}}
:root[data-theme="dark"]{--bg:#0f1b20;--surface:#172830;--ink:#e6f0f2;--muted:#93a9b1;--line:#27404a;--accent:#4cc3cf;--accent-ink:#06242a;--chip:#1f3640}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "IBM Plex Sans Arabic",Tahoma,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--surface);border-bottom:1px solid var(--line);z-index:9;padding:12px 16px 10px}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:19px;font-weight:600;margin:0 0 10px}
nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
nav a{white-space:nowrap;text-decoration:none;color:var(--ink);background:var(--chip);padding:7px 14px;border-radius:999px;font-weight:500;font-size:15px}
nav a[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
nav a:focus-visible,.go:focus-visible,input:focus-visible,button:focus-visible,a.tel:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
input{flex:1;min-width:180px;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button.f{font:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}
button.f[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{max-width:860px;margin:0 auto;padding:14px 16px 40px}
.count{color:var(--muted);font-size:14px;margin:4px 0 10px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.go{display:block;color:inherit;text-decoration:none}
.go:hover .nm{color:var(--accent)}
.nm{font-weight:600;font-size:16px;margin:0}
.ad{color:var(--muted);font-size:14px;margin:2px 0 0;overflow-wrap:anywhere}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.nav{color:var(--accent);font-weight:600;font-size:14px}
a.tel{color:var(--ink);font-size:14px;direction:ltr;unicode-bidi:embed;text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:3px 10px}
.mark{display:inline-block;background:var(--chip);border-radius:4px;font-size:12px;padding:0 6px;margin-inline-start:6px;vertical-align:middle}
.empty{padding:30px;text-align:center;color:var(--muted)}

[hidden]{display:none!important}
.tools{align-items:center}
.seg{display:flex;gap:6px}
#mapView{display:block}
.mt{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.mt .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:50%;display:inline-block}
.cvw{position:relative}
#cv{width:100%;height:min(62vh,560px);min-height:340px;background:var(--surface);border:1px solid var(--line);border-radius:10px;touch-action:none;cursor:grab;display:block}
.hint{color:var(--muted);font-size:13px;margin:6px 0}
#info{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px}
#info .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
#info input{flex:0 0 64px;min-width:0;width:64px;padding:6px 8px}
a.btn,button.pri{font:inherit;font-size:14px;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:8px 12px;text-decoration:none;cursor:pointer;display:inline-block}
h2{font-size:17px;margin:20px 0 8px}
.pl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.pl input{flex:0 0 64px;min-width:0;width:64px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px}
.day h3{font-size:15px;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.day ol{margin:0;padding-inline-start:22px}
.day li{border:0;padding:3px 0;border-radius:0;background:none;display:flex;justify-content:space-between;gap:8px;align-items:center}
.day li a{color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.x{border:0;background:var(--chip);color:var(--ink);border-radius:6px;width:28px;height:28px;font-size:16px;cursor:pointer;flex:none}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
</style>
</head>

<header><div class="wrap">
<h1>دليل الأغذية والمكملات</h1>
<nav id="tabs" aria-label="الأقسام"></nav>

</div></header>
<main>

<div class="mt"><button class="f" id="zi" aria-label="تكبير">＋</button><button class="f" id="zo" aria-label="تصغير">－</button><button class="f" id="zr">إعادة ضبط العرض</button><button class="f" id="sm" aria-pressed="false">تحديد بمربع</button><span class="sp"></span><span class="hint" id="mc"></span></div>

<div id="info" hidden></div>
<h2 id="ph">خطة الزيارة</h2>
<div class="pl"><label for="days">عدد الأيام</label><input id="days" type="number" min="1" max="7" value="1"><button class="f" id="clr">مسح الخطة</button><span class="hint" id="pc"></span></div>
<div id="plan"></div>
</section>
</main>

function togglePlan(it){plan.has(it.key)?plan.delete(it.key):plan.add(it.key);changed()}
function changed(){savePlan();updTab();renderPlan();if(cur==="map"){draw();showInfo()}else render()}
/* ---------- list ---------- */
function render(){
  const term=q.value.trim().toLowerCase();
  const rows=DATA[cur].filter(r=>(cur!=="supp"||visOk(r))&&(!term||(r.n+" "+r.a+" "+r.p).toLowerCase().includes(term)));
  list.replaceChildren();
  rows.forEach(r=>{
    const li=el("li"),a=el("a","go"),nm=el("p","nm",r.n);
    if(r.y)nm.appendChild(el("span","mark","تمت الزيارة"));
    a.href=navUrl(r);a.target="_blank";a.rel="noopener";
    a.append(nm,el("p","ad",r.a||"بدون عنوان مكتوب"),el("span","nav","ابدأ الملاحة على الخريطة"));
    const row=el("div","row");
    if(r.p){const t=el("a","tel",r.p);t.href="tel:"+r.p.replace(/[^+\d]/g,"");row.appendChild(t)}
    const it=IDX.get(keyOf(r)),b=el("button","f",plan.has(it.key)?"في الخطة ✓":"＋ أضف للخطة");
    b.setAttribute("aria-pressed",plan.has(it.key));b.onclick=()=>togglePlan(it);row.appendChild(b);
    li.append(a,row);list.appendChild(li);
  });
  if(!rows.length)list.appendChild(el("li","empty","لا توجد نتائج مطابقة"));
  cnt.textContent=rows.length+" نتيجة";
}
/* ---------- planning ---------- */
const d2=(a,b)=>(a.X-b.X)**2+(a.Y-b.Y)**2;
function groups(items,k){
  if(!items.length)return[];
  k=Math.min(k,items.length);
  const c=[items[0]];
  while(c.length<k){let best=null,bd=-1;for(const it of items){const d=Math.min(...c.map(z=>d2(it,z)));if(d>bd){bd=d;best=it}}c.push(best)}
  let cent=c.map(i=>[i.X,i.Y]),asg=[];
  for(let n=0;n<12;n++){
    asg=items.map(it=>{let bj=0,bd=Infinity;cent.forEach((z,j)=>{const d=(it.X-z[0])**2+(it.Y-z[1])**2;if(d<bd){bd=d;bj=j}});return bj});
    cent=cent.map((z,j)=>{const m=items.filter((_,i)=>asg[i]===j);return m.length?[m.reduce((s,i)=>s+i.X,0)/m.length,m.reduce((s,i)=>s+i.Y,0)/m.length]:z});
  }
  const gs=cent.map((z,j)=>({x:z[0],m:items.filter((_,i)=>asg[i]===j)})).filter(g=>g.m.length).sort((a,b)=>a.x-b.x);
  return gs.map(g=>{const rest=g.m.slice().sort((a,b)=>a.Y-b.Y),out=[rest.shift()];
    while(rest.length){const l=out[out.length-1];let bi=0,bd=Infinity;rest.forEach((it,i)=>{const d=d2(it,l);if(d<bd){bd=d;bi=i}});out.push(rest.splice(bi,1)[0])}
    return out});
}
function renderPlan(){
  const items=[...plan].map(k=>IDX.get(k)).filter(Boolean);
  const k=Math.max(1,Math.min(7,+$("days").value||1));
  GR=groups(items,k);dayOf.clear();
  const box=$("plan");box.replaceChildren();
  $("pc").textContent=items.length?items.length+" مكان في الخطة":"الخطة فاضية. اختار أماكن من الخريطة أو من القوائم.";
  GR.forEach((g,d)=>{
    g.forEach((it,i)=>dayOf.set(it.key,[d,i+1]));
    const sec=el("section","day"),h=el("h3"),dot=el("span","dot");dot.style.background=DAYC[d%7];
    h.append(dot,"اليوم "+(d+1)+" ("+g.length+" أماكن)");sec.appendChild(h);
    const ol=el("ol");
    g.forEach(it=>{const li=el("li"),a=el("a",null,it.n);a.href=navUrl(it);a.target="_blank";a.rel="noopener";
      const x=el("button","x","×");x.setAttribute("aria-label","إزالة من الخطة");x.onclick=()=>{plan.delete(it.key);changed()};li.append(a,x);ol.appendChild(li)});
    sec.appendChild(ol);
    const links=el("div","links");
    for(let s=0,n=1;s<g.length&&(s===0||g.length-s>1);s+=9,n++){
      const ch=g.slice(s,s+10),a=el("a","btn",g.length>10?"المسار "+n+" في Google Maps":"افتح مسار اليوم في Google Maps");
      a.href="https://www.google.com/maps/dir/"+ch.map(i=>i.lat+","+i.lng).join("/");a.target="_blank";a.rel="noopener";links.appendChild(a)}
    sec.appendChild(links);box.appendChild(sec);
  });
}
/* ---------- map ---------- */
const cv=$("cv"),ctx=cv.getContext("2d");
let W=0,H=0,V={x:0,y:0,s:1},S0=1,ready=false,rect=null;
const pool=()=>MAPS.filter(i=>plan.has(i.key)||(i.cats.some(c=>catOn[c])&&visOk(i)));
function fit(){
  const xs=MAPS.map(i=>i.X),ys=MAPS.map(i=>i.Y),a=Math.min(...xs),b=Math.max(...xs),c=Math.min(...ys),d=Math.max(...ys);
  V.x=(a+b)/2;V.y=(c+d)/2;V.s=S0=Math.min(W/((b-a)*1.1||1),H/((d-c)*1.1||1));
}
function size(){const dpr=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!ready){fit();ready=true}}
const px=i=>(i.X-V.x)*V.s+W/2,py=i=>(i.Y-V.y)*V.s+H/2;
function draw(){
  if(!W)return;
  const cs=getComputedStyle(document.documentElement),ink=cs.getPropertyValue("--ink").trim(),line=cs.getPropertyValue("--line").trim();
  ctx.clearRect(0,0,W,H);
  const P=pool(),sel=P.filter(i=>plan.has(i.key));
  P.filter(i=>!plan.has(i.key)).forEach(i=>{
    const col=CATS[i.cats[0]][1];ctx.beginPath();ctx.arc(px(i),py(i),5,0,7);
    if(i.y){ctx.lineWidth=2;ctx.strokeStyle=col;ctx.stroke()}else{ctx.fillStyle=col;ctx.globalAlpha=.85;ctx.fill();ctx.globalAlpha=1}
    if(foc&&foc.key===i.key){ctx.lineWidth=3;ctx.strokeStyle=ink;ctx.beginPath();ctx.arc(px(i),py(i),9,0,7);ctx.stroke()}
  });
  ctx.font="600 12px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  sel.forEach(i=>{const [d,n]=dayOf.get(i.key)||[0,0];ctx.beginPath();ctx.arc(px(i),py(i),10,0,7);ctx.fillStyle=DAYC[d%7];ctx.fill();
    ctx.lineWidth=foc&&foc.key===i.key?3:2;ctx.strokeStyle=foc&&foc.key===i.key?ink:"#fff";ctx.stroke();ctx.fillStyle="#fff";ctx.fillText(n,px(i),py(i)+.5)});
  const pk=V.s/111.32;let km=[1,2,5,10,20,50].find(k=>k*pk>=60)||50;
  ctx.strokeStyle=ink;ctx.fillStyle=ink;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(14,H-16);ctx.lineTo(14+km*pk,H-16);ctx.stroke();
  ctx.textAlign="left";ctx.font="12px sans-serif";ctx.fillText(km+" كم",14,H-26);
  if(rect){ctx.strokeStyle=ink;ctx.setLineDash([5,4]);ctx.lineWidth=1.5;ctx.strokeRect(rect.x0,rect.y0,rect.x1-rect.x0,rect.y1-rect.y0);ctx.setLineDash([])}
  $("mc").textContent=P.length+" نقطة معروضة"+(ALL.length>MAPS.length?" ("+(ALL.length-MAPS.length)+" خارج الرياض غير معروضة)":"");
}
function zoomAt(f,x,y){const X=(x-W/2)/V.s+V.x,Y=(y-H/2)/V.s+V.y;V.s=Math.max(S0*.8,Math.min(S0*80,V.s*f));V.x=X-(x-W/2)/V.s;V.y=Y-(y-H/2)/V.s;draw()}
const ptrs=new Map();let moved=0,lastD=0;
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);const r=cv.getBoundingClientRect();ptrs.set(e.pointerId,{x:e.clientX-r.left,y:e.clientY-r.top});moved=0;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];lastD=Math.hypot(a.x-b.x,a.y-b.y)}
  if(selMode&&ptrs.size===1){const p=ptrs.get(e.pointerId);rect={x0:p.x,y0:p.y,x1:p.x,y1:p.y}}});
cv.addEventListener("pointermove",e=>{const p=ptrs.get(e.pointerId);if(!p)return;const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,dx=x-p.x,dy=y-p.y;
  p.x=x;p.y=y;moved+=Math.abs(dx)+Math.abs(dy);
  if(ptrs.size===2){const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(lastD)zoomAt(d/lastD,(a.x+b.x)/2,(a.y+b.y)/2);lastD=d}
  else if(rect){rect.x1=x;rect.y1=y;draw()}
  else{V.x-=dx/V.s;V.y-=dy/V.s;draw()}});
cv.addEventListener("pointerup",e=>{const p=ptrs.get(e.pointerId);ptrs.delete(e.pointerId);lastD=0;if(!p)return;
  if(rect){const x0=Math.min(rect.x0,rect.x1),x1=Math.max(rect.x0,rect.x1),y0=Math.min(rect.y0,rect.y1),y1=Math.max(rect.y0,rect.y1);rect=null;
    if(x1-x0>6||y1-y0>6){pool().forEach(i=>{const a=px(i),b=py(i);if(a>=x0&&a<=x1&&b>=y0&&b<=y1)plan.add(i.key)});changed();return}draw();return}
  if(moved<6){let best=null,bd=18*18;pool().forEach(i=>{const d=(px(i)-p.x)**2+(py(i)-p.y)**2;if(d<bd){bd=d;best=i}});foc=best;draw();showInfo()}});
cv.addEventListener("pointercancel",e=>{ptrs.delete(e.pointerId);rect=null});
cv.addEventListener("wheel",e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoomAt(e.deltaY<0?1.25:.8,e.clientX-r.left,e.clientY-r.top)},{passive:false});
$("zi").onclick=()=>zoomAt(1.5,W/2,H/2);$("zo").onclick=()=>zoomAt(1/1.5,W/2,H/2);$("zr").onclick=()=>{fit();draw()};
$("sm").onclick=()=>{selMode=!selMode;$("sm").setAttribute("aria-pressed",selMode);cv.style.cursor=selMode?"crosshair":"grab"};
$("clr").onclick=()=>{if(!plan.size||confirm("مسح كل الأماكن من الخطة؟")){plan.clear();changed()}};
$("days").oninput=()=>{renderPlan();draw()};
Object.entries(CATS).forEach(([k,[t,c]])=>{const b=el("button","f chip");const s=el("span","sw");s.style.background=c;b.append(s,t);b.setAttribute("aria-pressed",true);b.onclick=()=>{catOn[k]=catOn[k]?0:1;b.setAttribute("aria-pressed",!!catOn[k]);draw()};$("cats").appendChild(b)});
function showInfo(){
  const box=$("info");if(!foc){box.hidden=true;return}
  box.hidden=false;box.replaceChildren();
  const it=foc,nm=el("p","nm",it.n);if(it.y)nm.appendChild(el("span","mark","تمت الزيارة"));
  box.append(nm,el("p","ad",it.a||"بدون عنوان مكتوب"),el("p","ad",it.cats.map(c=>CATS[c][0]).join(" + ")+(it.p?" · "+it.p:"")));
  const acts=el("div","acts"),go=el("a","btn","ابدأ الملاحة");go.href=navUrl(it);go.target="_blank";go.rel="noopener";
  const tb=el("button","f",plan.has(it.key)?"إزالة من الخطة":"＋ أضف للخطة");tb.onclick=()=>togglePlan(it);
  const n=el("input");n.type="number";n.min=2;n.max=30;n.value=8;n.setAttribute("aria-label","العدد");
  const nb=el("button","f","أضف أقرب مجموعة منه");
  nb.onclick=()=>{const m=Math.max(2,Math.min(30,+n.value||8));pool().slice().sort((a,b)=>d2(a,it)-d2(b,it)).slice(0,m).forEach(i=>plan.add(i.key));changed()};
  acts.append(go,tb,n,nb);box.appendChild(acts);
}
/* ---------- routing ---------- */
function route(){
  const h=location.hash.slice(1);cur=DATA[h]||h==="map"?h:"dist";
  tabs.querySelectorAll("a").forEach(a=>a.setAttribute("aria-current",a.dataset.k===cur));
  const isMap=cur==="map";
  $("listView").hidden=isMap;$("mapView").hidden=!isMap;q.hidden=isMap;
  $("vf").hidden=!(isMap||cur==="supp");
  $("vf").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",vis===+b.dataset.v));
  updTab();
  if(isMap){size();renderPlan();draw();showInfo()}else render();
}
$("vf").onclick=e=>{const b=e.target.closest("button");if(!b)return;vis=vis===+b.dataset.v?0:+b.dataset.v;route()};
q.oninput=render;addEventListener("hashchange",route);
addEventListener("resize",()=>{if(cur==="map"){const f=ready;size();draw()}});
route();
</script>
</body>
</html>
